<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QadaPrayer — Make up what is owed</title>
    <meta
      name="description"
      content="Offline tracker for missed prayers, with a steady daily make-up plan. No account, no servers."
    />
    <meta name="theme-color" content="#06100f" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QadaPrayer" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body dir="ltr" lang="en">
    <div id="app">
      <div class="boot">
        <span class="boot__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 19.4 6.6v8.8L12 19.4 4.6 15.4V6.6z" opacity=".55" />
            <path d="M12 5.2v9.2" />
            <path d="M9.4 8.1a4 4 0 1 0 0 5.6" />
          </svg>
        </span>
        <span>QadaPrayer</span>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; color: #e9f3ef; font-family: system-ui">
        QadaPrayer needs JavaScript to calculate prayer times and store your progress on this device.
      </p>
    </noscript>
    <script type="module" src="./js/main.js"></script>
    <!-- The service worker is registered by js/updater.js, which also handles
         update detection and the "new version" prompt. -->
  </body>
</html>
